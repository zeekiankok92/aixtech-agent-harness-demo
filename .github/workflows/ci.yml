name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans full history

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Gate 1 - ruff lint
        run: ruff check .

      - name: Gate 2 - ruff format
        run: ruff format --check .

      - name: Gate 3 - tests with coverage threshold (90%)
        run: |
          pytest --cov-report=xml
          python scripts/coverage_badge.py --check

      - name: Gate 4 - PDPA personal-data guard
        run: python scripts/check_pdpa.py

      - name: Gate 5 - secret scan (gitleaks)
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
          ./gitleaks git --redact --no-banner .
          ./gitleaks dir --redact --no-banner .

      - name: Gate 6 - dependency licence allow-list
        run: >
          pip-licenses --partial-match --ignore-packages sgweather
          --allow-only="MIT;BSD;Apache;ISC;Python Software Foundation;PSF;MPL-2.0;Mozilla Public License 2.0"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
